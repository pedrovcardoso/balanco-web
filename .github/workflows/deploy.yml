name: Deploy VPS on Push

on:
  push:
    branches:
      - main

# Evita execuções simultâneas em pushes muito rápidos
concurrency:
  group: deploy-balanco
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vps-balanco]
    steps:
      - name: Atualizar repositório e reiniciar containers
        run: |
          echo "Iniciando atualização em $(date)..."
          
          # 1. Atualizar o código do balanco-web2
          cd /home/lepipe/lepipe.org/apps/balanco-web2
          git fetch origin main
          git reset --hard origin/main
          
          # 2. Recompilar e reiniciar apenas os containers do balanco
          # O parâmetro --no-deps garante que nenhum outro serviço (mysql, php, airflow, etc) seja afetado
          cd /home/lepipe/lepipe.org
          docker compose build balanco_frontend balanco_backend
          docker compose up -d --no-deps balanco_frontend balanco_backend
          
          # 3. Recarregar o nginx principal para atualizar o cache de IP interno do Docker (evita erro 502)
          docker exec lepipe_nginx nginx -s reload
          
          echo "Deploy finalizado com sucesso em $(date)!"
